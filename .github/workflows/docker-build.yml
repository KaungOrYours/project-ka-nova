name: Build and Push Docker Image

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WANDB_MODE: disabled

jobs:
  # The build job used to be the whole pipeline: every push to main was built
  # and published to Docker Hub as :latest with no check of any kind, so code
  # that did not even compile would still ship an image the pods then pull at
  # boot. This job is the gate. It runs the same suite that is run by hand
  # before a launch, so a broken main cannot reach a pod.
  #
  # It deliberately does NOT need a GPU. Everything here is the rule-based
  # path plus static checks, which is what a GitHub runner can do for free.
  # The one failure class that is GPU-only (a real LLM call) is covered as far
  # as it can be by test_prompt_templates.py, which renders every prompt
  # without invoking a model — see that file's header for why.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'    # matches the Dockerfile base image
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sweep, every tracked Python file
        run: git ls-files '*.py' | xargs -n1 python -m py_compile

      - name: All 7 constitutions validate
        run: |
          python - <<'EOF'
          from config.scenario_registry import SCENARIOS
          bad = [c for c, e in SCENARIOS.items() if not e.constitution.validate()]
          assert not bad, f"constitutions failed validate(): {bad}"
          print(f"{len(SCENARIOS)}/{len(SCENARIOS)} constitutions valid")
          EOF

      - name: Prompt templates render for every scenario and role
        run: python tests/test_prompt_templates.py

      - name: LLM path end to end, stand-in model
        run: python tests/test_llm_path_e2e.py

      - name: Full systems diagnostic
        run: python tests/test_full_diagnostic.py

      - name: Suppression vs parse-failure boundary
        run: python tests/test_suppression_boundary.py

      - name: North-star decomposition
        run: python tests/test_north_star_decomposition.py

      - name: Adversarial debiasing gate
        run: python tests/adversarial_debiasing/runner.py

      - name: Every scenario runs end to end, rule-based
        env:
          # Keep the smoke run out of the tracked results_phase3/ files, which
          # are the published audit trail. A CI run that appended to them would
          # repeat the pollution incident of 2026-10-29.
          KA_NOVA_RESULTS_DIR: ${{ runner.temp }}/ci_results
        run: |
          for S in A C SK TH PK CL DE; do
            echo "--- scenario $S ---"
            python run_phase3.py --scenario "$S" --runs 1 --citizens 300 --steps 3 --workers 1 > /dev/null
          done
          echo "all 7 scenarios clean"

  build:
    runs-on: ubuntu-latest
    needs: test          # nothing is published unless the suite above is green
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ka-nova-phase3:latest
            ${{ secrets.DOCKER_USERNAME }}/ka-nova-phase3:${{ github.sha }}

      - name: Notify success
        run: echo "Docker image pushed — ${{ secrets.DOCKER_USERNAME }}/ka-nova-phase3:latest"
